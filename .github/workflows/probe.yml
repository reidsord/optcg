name: Probe TCG+ (temporary)
on:
  pull_request:
    paths: ["scripts/probe_tcgplus.py", ".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -u scripts/probe_tcgplus.py
