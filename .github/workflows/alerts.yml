name: Check events and drops

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/probe_sources.py"
      - ".github/workflows/alerts.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/probe_sources.py
