name: Check events and drops

on:
  schedule:
    - cron: "41 * * * *" # hourly, so registration reminders land 1 to 2 hours ahead
  workflow_dispatch:
    inputs:
      test:
        description: "Send a Discord test for events matching these words (e.g. EB05 prerelease). Leave empty for a normal check."
        required: false
        default: ""
  pull_request:
    paths:
      - "scripts/update_events.py"
      - ".github/workflows/alerts.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check sources (pull requests only)
        if: github.event_name == 'pull_request'
        run: python3 scripts/update_events.py --dry-run --test-home 39.6134,-86.1047

      - name: Look for new events and drops
        if: github.event_name != 'pull_request' && !inputs.test
        run: python3 scripts/update_events.py --notify "$RUNNER_TEMP/alert.md" --discord "$RUNNER_TEMP/discord.jsonl"

      - name: Build a Discord test message
        if: inputs.test
        env:
          TEST_QUERY: ${{ inputs.test }}
        run: python3 scripts/update_events.py --test-discord "$TEST_QUERY" --discord "$RUNNER_TEMP/discord.jsonl"

      - name: Commit changes
        if: github.event_name != 'pull_request' && !inputs.test
        run: |
          git config user.name "optcg-alerts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/drops.json data/watch.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update events and drops"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Open an issue for anything new
        if: github.event_name != 'pull_request' && !inputs.test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="$RUNNER_TEMP/alert.md"
          [ -s "$f" ] || exit 0
          gh label create alert --color D93F0B --description "New tournaments and drops" --force
          gh issue create --title "$(head -n 1 "$f")" --body "$(tail -n +2 "$f")" --label alert

      - name: Post to Discord
        if: github.event_name != 'pull_request'
        env:
          DISCORD_EVENT_WEBHOOK_URL: ${{ secrets.DISCORD_EVENT_WEBHOOK_URL }}
        run: |
          f="$RUNNER_TEMP/discord.jsonl"
          [ -s "$f" ] || exit 0
          if [ -z "$DISCORD_EVENT_WEBHOOK_URL" ]; then
            echo "::warning::No DISCORD_EVENT_WEBHOOK_URL repository secret, so nothing was posted to Discord."
            exit 0
          fi
          while IFS= read -r payload; do
            curl -sS --fail-with-body -H "Content-Type: application/json" -d "$payload" "$DISCORD_EVENT_WEBHOOK_URL"
            sleep 1
          done < "$f"
