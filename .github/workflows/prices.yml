name: Update prices and new cards

on:
  schedule:
    - cron: "17 11 * * *" # daily, after tcgcsv.com publishes TCGplayer's overnight data
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Only send a sample price alert to Discord (no price update)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/prices.yml"

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Check against TCGplayer data (pull requests only)
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/update_prices.py --dry-run
          python3 scripts/set_colors.py --all --dry-run
          python3 scripts/price_alerts.py --dry-run
          python3 scripts/price_alerts.py --test

      - name: Update prices and add new cards
        if: github.event_name != 'pull_request' && !inputs.test_alert
        run: |
          python3 scripts/update_prices.py
          python3 scripts/set_colors.py

      - name: Check price alerts
        if: github.event_name != 'pull_request' && !inputs.test_alert
        run: python3 scripts/price_alerts.py --discord "$RUNNER_TEMP/discord.jsonl"

      - name: Build a sample price alert
        if: inputs.test_alert
        run: python3 scripts/price_alerts.py --test --discord "$RUNNER_TEMP/discord.jsonl"

      - name: Commit changes
        if: github.event_name != 'pull_request' && !inputs.test_alert
        run: |
          git config user.name "optcg-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Daily price update"
          # Quantity edits from the site can land while this runs; one card per
          # line means those merge cleanly with price changes.
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Post price alerts to Discord
        if: github.event_name != 'pull_request'
        env:
          DISCORD_PRICE_WEBHOOK_URL: ${{ secrets.DISCORD_PRICE_WEBHOOK_URL }}
        run: |
          f="$RUNNER_TEMP/discord.jsonl"
          [ -s "$f" ] || exit 0
          if [ -z "$DISCORD_PRICE_WEBHOOK_URL" ]; then
            echo "::warning::No DISCORD_PRICE_WEBHOOK_URL repository secret, so no price alerts were posted to Discord."
            exit 0
          fi
          while IFS= read -r payload; do
            curl -sS --fail-with-body -H "Content-Type: application/json" -d "$payload" "$DISCORD_PRICE_WEBHOOK_URL"
            sleep 1
          done < "$f"
