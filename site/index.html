<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reid's collection</title>
<meta name="description" content="Reid's One Piece Card Game inventory, set progress, buy list and orders.">
<meta name="theme-color" content="#0f1714">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPTCG">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
<script>
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="eyebrow">One Piece Card Game</span>
    <h1>Reid's collection</h1>
  </div>
  <div class="top-actions">
    <span id="save-status" class="pill" hidden></span>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch light or dark theme" title="Theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button id="account-btn" class="btn" type="button">Sign in</button>
  </div>
</header>

<section class="stats" aria-label="Collection summary">
  <div class="stat stat-main"><span class="label">Collection value</span><strong id="stat-value">–</strong></div>
  <div class="stat"><span class="label">Copies</span><strong id="stat-copies">–</strong></div>
  <div class="stat"><span class="label">Owned variants</span><strong id="stat-owned">–</strong></div>
  <div class="stat"><span class="label">Prices</span><strong id="stat-prices">–</strong></div>
</section>

<nav class="tabs" aria-label="Sections">
  <a href="#home" data-tab="home">Home</a>
  <a href="#cards" data-tab="cards">Cards</a>
  <a href="#packs" data-tab="packs">Packs</a>
  <a href="#decks" data-tab="decks">Decks</a>
  <a href="#events" data-tab="events">Events</a>
  <a href="#orders" data-tab="orders">Orders</a>
  <a href="#history" data-tab="history">History</a>
</nav>

<main id="main">
  <p class="loading">Loading your collection…</p>
</main>

<footer class="foot">
  <span>Anyone with the link can view. Only Reid can edit.</span>
  <span id="foot-source"></span>
</footer>

<dialog id="account-dialog"></dialog>
<dialog id="order-dialog"></dialog>
<dialog id="card-dialog" class="card-dialog" aria-label="Card details"></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
